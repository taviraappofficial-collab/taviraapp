services:
  - type: web
    name: tavira-api
    runtime: node
    region: frankfurt
    branch: master
    autoDeployTrigger: checksPass
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @tavira/api... build
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm --filter @tavira/api start
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: tavira-admin
    runtime: node
    region: frankfurt
    branch: master
    autoDeployTrigger: checksPass
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @tavira/admin... build
    startCommand: pnpm --filter @tavira/admin start
    healthCheckPath: /auth/sign-in
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      - key: NODE_ENV
        value: production
      - key: TAVIRA_API_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
